[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "algorythm5"
version = "0.1.0"
description = "Turns messy customer exports into clean, newsletter-ready files with a change log and review list."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.34",
    "pydantic-settings==2.16.3",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
    "charset-normalizer==3.5.2",
    "ftfy==6.3.1",
    "phonenumbers==9.0.43",
    "email-validator==2.4.0",
    "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
algorythm5 = ["cleaning/data/*", "db/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use look-alike Unicode (NBSP, curly quotes, Greek) as inputs.
"tests/**" = ["S101", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["algorythm5"]
branch = true
